seed: 42

paths:
  raw_dir: "data/raw"
  global_subdir: "data_global"
  stats_subdir: "data_stats"
  interim_dir: "data/interim"
  processed_dir: "data/processed"

carbonglobe:
  n_sites: 54152
  n_years: 40
  n_months: 12
  n_features: 136
  n_targets: 7
  grid_shape: [360, 720]
  tree_band: ["height", "agb", "soil", "lai", "gpp", "npp", "rh"]
  ages: [1, 10, 20, 30, 50, 70, 100, 150, 200, 250, 300, 350, 400, 450, 500]
  ml_ready_file: "res_train4_test8.npz"
  stats_file: "data_stats.npz"
  mask_file: "mask2d.npy"

cleaning:
  clip_z_range: [-10.0, 10.0]
  eps_std: 1.0e-6

# Tập con dữ liệu THẬT cho Tuần 3-4: EDA, ablation, chốt ngưỡng làm sạch/đặc trưng
# và huấn luyện baseline. Kích thước mục tiêu 200-500 site, cố định theo seed để tái lập.
subset:
  enabled: true
  max_sites: 500
  # random | stratified
  # stratified: lấy mẫu tỷ lệ theo phân vị của biến mục tiêu -> phủ đủ dải sinh thái
  # mà vẫn xấp xỉ phân phối toàn cầu của train.
  strategy: "stratified"
  stratify_by: "agb"
  n_bins: 5
  # false: giữ nguyên toàn bộ test8 (852 site) làm tập đánh giá rollout cố định.
  subset_test: false
